name: health/external

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  staging:
    if: ${{ secrets.STAGING_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait
        run: bash scripts/ci/wait-for-url.sh "${{ secrets.STAGING_API_BASE_URL }}/healthz" 30 2
      - name: Healthz
        run: curl -fsS "${{ secrets.STAGING_API_BASE_URL }}/healthz"
      - name: Metrics
        run: curl -fsS "${{ secrets.STAGING_API_BASE_URL }}/metrics" | head -n 40
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `health/staging 失败: ${new Date().toISOString()}`;
            const body = `- baseUrl: ${process.env.STAGING_API_BASE_URL}\n- run: ${runUrl}\n`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}

  production:
    if: ${{ secrets.PROD_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait
        run: bash scripts/ci/wait-for-url.sh "${{ secrets.PROD_API_BASE_URL }}/healthz" 30 2
      - name: Healthz
        run: curl -fsS "${{ secrets.PROD_API_BASE_URL }}/healthz"
      - name: Metrics
        run: curl -fsS "${{ secrets.PROD_API_BASE_URL }}/metrics" | head -n 40
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `health/production 失败: ${new Date().toISOString()}`;
            const body = `- baseUrl: ${process.env.PROD_API_BASE_URL}\n- run: ${runUrl}\n`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}

