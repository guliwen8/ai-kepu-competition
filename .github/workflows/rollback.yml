name: rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "回滚目标环境"
        required: true
        type: choice
        options:
          - staging
          - production
      tag:
        description: "要回滚到的 Release tag（例如 v1.2.3）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    if: inputs.environment == 'staging' && secrets.STAGING_SSH_HOST != '' && secrets.STAGING_SSH_USER != '' && secrets.STAGING_SSH_KEY != ''
    env:
      TAG: ${{ inputs.tag }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH || '/opt/aikepu/releases' }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          gh release download "$TAG" -p "*.tgz" -D .artifacts
          gh release download "$TAG" -p "COMMIT_SHA" -D .artifacts || true

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload bundle
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -p $SSH_PORT" .artifacts/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/$TAG/"

      - name: Remote rollback (standard)
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -euo pipefail; cd \"$DEPLOY_PATH/$TAG\"; tar -xzf \"deploy-$TAG.tgz\"; DEPLOY_PATH=\"$DEPLOY_PATH\" TAG=\"$TAG\" API_BASE_URL=\"$API_BASE_URL\" bash \"deploy/rollback.sh\""

      - name: Remote rollback (custom)
        if: secrets.STAGING_ROLLBACK_COMMAND != ''
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "${{ secrets.STAGING_ROLLBACK_COMMAND }}"

      - name: Post-rollback health check (optional)
        if: secrets.STAGING_API_BASE_URL != ''
        run: |
          curl -fsS "${{ secrets.STAGING_API_BASE_URL }}/healthz"

  rollback-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: inputs.environment == 'production' && secrets.PROD_SSH_HOST != '' && secrets.PROD_SSH_USER != '' && secrets.PROD_SSH_KEY != ''
    env:
      TAG: ${{ inputs.tag }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || '/opt/aikepu/releases' }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          gh release download "$TAG" -p "*.tgz" -D .artifacts
          gh release download "$TAG" -p "COMMIT_SHA" -D .artifacts || true

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload bundle
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -p $SSH_PORT" .artifacts/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/$TAG/"

      - name: Remote rollback (standard)
        env:
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -euo pipefail; cd \"$DEPLOY_PATH/$TAG\"; tar -xzf \"deploy-$TAG.tgz\"; DEPLOY_PATH=\"$DEPLOY_PATH\" TAG=\"$TAG\" API_BASE_URL=\"$API_BASE_URL\" bash \"deploy/rollback.sh\""

      - name: Remote rollback (custom)
        if: secrets.PROD_ROLLBACK_COMMAND != ''
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "${{ secrets.PROD_ROLLBACK_COMMAND }}"

      - name: Post-rollback health check (optional)
        if: secrets.PROD_API_BASE_URL != ''
        run: |
          curl -fsS "${{ secrets.PROD_API_BASE_URL }}/healthz"
