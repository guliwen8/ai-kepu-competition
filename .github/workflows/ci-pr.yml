name: ci/pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
      miniapp: ${{ steps.filter.outputs.miniapp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            admin_web:
              - 'apps/admin-web/**'
            miniapp:
              - 'apps/miniapp/**'
            shared:
              - 'packages/shared/**'

  checks:
    name: checks (format/lint/typecheck/build)
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Shared checks
        if: needs.changes.outputs.shared == 'true'
        run: |
          npm -w @aikepu/shared run typecheck
          npm -w @aikepu/shared run build

      - name: API checks
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          npm -w api run lint
          npm -w api run typecheck
          npm -w api run test
          npm -w api run build

      - name: Admin-Web checks
        if: needs.changes.outputs.admin_web == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          npm -w admin-web run lint
          npm -w admin-web run typecheck
          npm -w admin-web run build

      - name: Miniapp build (weapp)
        if: needs.changes.outputs.miniapp == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          npm -w taro_template run build:weapp

  api-smoke:
    name: api smoke
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aikepu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aikepu?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 7d
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap
      API_PORT: 3001
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate + migrate deploy
        run: |
          npm -w api run prisma:generate
          npm -w api exec -- prisma migrate deploy

      - name: Build api
        run: npm -w api run build

      - name: Start api (background)
        run: |
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)

      - name: Wait api
        run: bash scripts/ci/wait-for-url.sh http://localhost:3001/ 60 2

      - name: Healthz
        run: curl -fsS http://localhost:3001/healthz

      - name: Metrics
        run: curl -fsS http://localhost:3001/metrics | head -n 20

      - name: Smoke
        run: API_BASE_URL=http://localhost:3001 npm -w api run smoke

      - name: Smoke (admin)
        run: API_BASE_URL=http://localhost:3001 npm -w api run admin:smoke

      - name: Smoke (judging)
        run: API_BASE_URL=http://localhost:3001 npm -w api run judging:smoke

      - name: Smoke (ranking)
        run: API_BASE_URL=http://localhost:3001 npm -w api run ranking:smoke

      - name: Smoke (audit)
        run: API_BASE_URL=http://localhost:3001 npm -w api run audit:smoke

      - name: Dump api log on failure
        if: failure()
        run: |
          echo "----- /tmp/api.log -----"
          cat /tmp/api.log || true

  pr-alert:
    name: pr alert
    runs-on: ubuntu-latest
    needs: [checks, api-smoke]
    if: always() && (needs.checks.result == 'failure' || needs.api-smoke.result == 'failure')
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `CI 阻断：本次检查未通过（失败即禁止合并）。\n\n- 运行详情：${runUrl}\n\n请修复后重新 push。`
            });
