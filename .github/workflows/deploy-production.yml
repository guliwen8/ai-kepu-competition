name: deploy/production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的 Release tag（例如 v1.2.3）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: secrets.PROD_SSH_HOST != '' && secrets.PROD_SSH_USER != '' && secrets.PROD_SSH_KEY != ''
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || '/opt/aikepu/releases' }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          gh release download "$TAG" -p "*.tgz" -D .artifacts
          gh release download "$TAG" -p "COMMIT_SHA" -D .artifacts || true
          ls -la .artifacts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload bundle
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -p $SSH_PORT" .artifacts/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/$TAG/"

      - name: Remote deploy (standard)
        env:
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -euo pipefail; cd \"$DEPLOY_PATH/$TAG\"; tar -xzf \"deploy-$TAG.tgz\"; DEPLOY_PATH=\"$DEPLOY_PATH\" TAG=\"$TAG\" API_BASE_URL=\"$API_BASE_URL\" bash \"deploy/apply.sh\""

      - name: Remote deploy (custom override)
        if: secrets.PROD_DEPLOY_COMMAND != ''
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "${{ secrets.PROD_DEPLOY_COMMAND }}"

      - name: Post-deploy health check (optional)
        if: secrets.PROD_API_BASE_URL != ''
        run: |
          curl -fsS "${{ secrets.PROD_API_BASE_URL }}/healthz"
