name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（需已存在，例如 v1.2.3）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aikepu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aikepu?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 7d
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap
      API_PORT: 3001
      LLM_PROVIDER: none
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Prisma generate + migrate deploy
        run: |
          npm -w api run prisma:generate
          npm -w api exec -- prisma migrate deploy

      - name: API unit + e2e
        run: |
          npm -w api run test
          npm -w api run test:e2e

      - name: Build all
        run: npm run build

      - name: Pack artifacts
        run: |
          set -euo pipefail
          mkdir -p .artifacts

          if [ -d apps/api/prisma ]; then
            tar -czf ".artifacts/api-${TAG}.tgz" -C apps/api dist package.json prisma
          else
            tar -czf ".artifacts/api-${TAG}.tgz" -C apps/api dist package.json
          fi

          tar -czf ".artifacts/admin-web-${TAG}.tgz" -C apps/admin-web .next public package.json 2>/dev/null || true
          tar -czf ".artifacts/miniapp-${TAG}.tgz" -C apps/miniapp dist package.json project.config.json 2>/dev/null || true
          tar -czf ".artifacts/deploy-${TAG}.tgz" -C scripts deploy

          printf "%s\n" "${GITHUB_SHA}" > .artifacts/COMMIT_SHA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          files: |
            .artifacts/*.tgz
            .artifacts/COMMIT_SHA
