name: ci/main

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  checks:
    name: checks (format/lint/typecheck/build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Shared
        run: |
          npm -w @aikepu/shared run typecheck
          npm -w @aikepu/shared run build

      - name: API
        run: |
          npm -w api run lint
          npm -w api run typecheck
          npm -w api run test
          npm -w api run build

      - name: Admin-Web
        run: |
          npm -w admin-web run lint
          npm -w admin-web run typecheck
          npm -w admin-web run build

      - name: Miniapp build (weapp)
        run: |
          npm -w taro_template run build:weapp

  api-regression:
    name: api regression (e2e + smoke)
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aikepu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aikepu?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 7d
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap
      API_PORT: 3001
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate + migrate deploy
        run: |
          npm -w api run prisma:generate
          npm -w api exec -- prisma migrate deploy

      - name: E2E
        run: npm -w api run test:e2e

      - name: Build api
        run: npm -w api run build

      - name: Start api (background)
        run: |
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)

      - name: Wait api
        run: bash scripts/ci/wait-for-url.sh http://localhost:3001/ 60 2

      - name: Healthz
        run: curl -fsS http://localhost:3001/healthz

      - name: Metrics
        run: curl -fsS http://localhost:3001/metrics | head -n 20

      - name: Smoke
        run: API_BASE_URL=http://localhost:3001 npm -w api run smoke

      - name: Smoke (admin)
        run: API_BASE_URL=http://localhost:3001 npm -w api run admin:smoke

      - name: Smoke (judging)
        run: API_BASE_URL=http://localhost:3001 npm -w api run judging:smoke

      - name: Smoke (ranking)
        run: API_BASE_URL=http://localhost:3001 npm -w api run ranking:smoke

      - name: Smoke (audit)
        run: API_BASE_URL=http://localhost:3001 npm -w api run audit:smoke

      - name: Dump api log on failure
        if: failure()
        run: |
          echo "----- /tmp/api.log -----"
          cat /tmp/api.log || true

  alert:
    name: alert (failure -> issue)
    runs-on: ubuntu-latest
    needs: [checks, api-regression]
    if: always() && (needs.checks.result == 'failure' || needs.api-regression.result == 'failure')
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const title = `ci/main 失败: ${sha}`;
            const body = [
              `- commit: ${context.sha}`,
              `- run: ${runUrl}`,
              `- checks: ${'${{ needs.checks.result }}'}`,
              `- api-regression: ${'${{ needs.api-regression.result }}'}`,
              '',
              '处理建议：先看失败的 step 日志，修复后重新 push 触发。'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

  build-artifacts:
    name: build artifacts (release bundle)
    runs-on: ubuntu-latest
    needs: [checks, api-regression]
    if: needs.checks.result == 'success' && needs.api-regression.result == 'success'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build all
        run: npm run build

      - name: Pack artifacts
        run: |
          set -euo pipefail
          mkdir -p .artifacts

          if [ -d apps/api/prisma ]; then
            tar -czf ".artifacts/api-${GITHUB_SHA}.tgz" -C apps/api dist package.json prisma
          else
            tar -czf ".artifacts/api-${GITHUB_SHA}.tgz" -C apps/api dist package.json
          fi

          tar -czf ".artifacts/admin-web-${GITHUB_SHA}.tgz" -C apps/admin-web .next public package.json 2>/dev/null || true
          tar -czf ".artifacts/miniapp-${GITHUB_SHA}.tgz" -C apps/miniapp dist package.json project.config.json 2>/dev/null || true
          tar -czf ".artifacts/deploy-${GITHUB_SHA}.tgz" -C scripts deploy

          echo "${GITHUB_SHA}" > .artifacts/COMMIT_SHA

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: .artifacts/*
          retention-days: 14

  deploy-staging:
    name: deploy staging (optional, gated)
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: needs.build-artifacts.result == 'success' && secrets.STAGING_SSH_HOST != '' && secrets.STAGING_SSH_USER != '' && secrets.STAGING_SSH_KEY != ''
    timeout-minutes: 30
    environment: staging
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH || '/opt/aikepu/releases' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: .artifacts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload bundle
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -p $SSH_PORT" .artifacts/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/${GITHUB_SHA}/"

      - name: Remote deploy (standard)
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -euo pipefail; cd \"$DEPLOY_PATH/${GITHUB_SHA}\"; tar -xzf \"deploy-${GITHUB_SHA}.tgz\"; DEPLOY_PATH=\"$DEPLOY_PATH\" TAG=\"${GITHUB_SHA}\" API_BASE_URL=\"$API_BASE_URL\" bash \"deploy/apply.sh\""

      - name: Remote deploy (custom override)
        if: secrets.STAGING_DEPLOY_COMMAND != ''
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "${{ secrets.STAGING_DEPLOY_COMMAND }}"

      - name: Post-deploy health check (optional)
        if: secrets.STAGING_API_BASE_URL != ''
        run: |
          curl -fsS "${{ secrets.STAGING_API_BASE_URL }}/healthz"
